name: Compilar ejecutable Windows

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Generar ícono e imagen de inicio
        run: |
          python -c "from planificacion_pm.tema import guardar_ico; guardar_ico('icono.ico')"
          python -c "from planificacion_pm.splash import guardar_png; guardar_png('splash.png')"

      - name: Compilar PlanificacionPM.exe
        run: pyinstaller --noconfirm --onefile --windowed --icon icono.ico --splash splash.png --hidden-import PIL._tkinter_finder --name PlanificacionPM main.py

      - name: Publicar ejecutable (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: PlanificacionPM-windows
          path: dist/PlanificacionPM.exe
          if-no-files-found: error

      - name: Leer versión
        id: ver
        shell: bash
        run: echo "v=$(python -c 'from planificacion_pm import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Publicar versión (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Planificación PM v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/PlanificacionPM.exe
          make_latest: true
          body: |
            Descargue **PlanificacionPM.exe** (abajo, en «Assets») y ábralo con doble clic.

            Si ya tiene instalada una versión con actualización automática (v10.3 o posterior), no necesita descargar nada:
            el programa avisa en la barra lateral y se actualiza desde **Configuración > Buscar actualizaciones**.
            Sus datos se conservan (están en Documentos\PlanificacionPM).

            **Mac (versión de muestra):** está disponible en la versión v11.0:
            https://github.com/RodrigoAvila321/Prueba/releases/download/v11.0/PlanificacionPM-Mac.zip

  mac-muestra:
    # Versión de muestra para Mac (datos de ejemplo ficticios). DESACTIVADA: la muestra quedó fija en la Release v11.0.
    # Para volver a generarla, cambiar «if: false» por «if: true».
    if: false
    needs: windows-exe
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Generar ícono
        run: python -c "from planificacion_pm.tema import dibujar; dibujar('logo').save('icono.png')"

      - name: Compilar Planificacion PM.app
        run: pyinstaller --noconfirm --windowed --icon icono.png --hidden-import PIL._tkinter_finder --osx-bundle-identifier cl.planificacionpm.muestra --name "Planificacion PM" main.py

      - name: Empaquetar
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Planificacion PM.app" PlanificacionPM-Mac.zip

      - name: Publicar app (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: PlanificacionPM-Mac
          path: PlanificacionPM-Mac.zip
          if-no-files-found: error

      - name: Leer versión
        id: ver
        run: echo "v=$(python -c 'from planificacion_pm import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Adjuntar a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: PlanificacionPM-Mac.zip
