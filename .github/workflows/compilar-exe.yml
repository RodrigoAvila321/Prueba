name: Compilar ejecutable Windows

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Generar ícono
        run: python -c "from planificacion_pm.tema import guardar_ico; guardar_ico('icono.ico')"

      - name: Compilar PlanificacionPM.exe
        run: pyinstaller --noconfirm --onefile --windowed --icon icono.ico --name PlanificacionPM main.py

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: PlanificacionPM-windows
          path: dist/PlanificacionPM.exe
          if-no-files-found: error
